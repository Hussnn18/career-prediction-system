<!DOCTYPE html>
<html>
<head>
    <title>Career Recommendation System</title>
    <style>
        body {
            font-family: Arial;
            background:#f2f2f2;
            padding:40px;
        }
        .container {
            width:400px;
            background:white;
            padding:30px;
            margin:auto;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }
        input, select {
            width:100%;
            padding:10px;
            margin:10px 0;
            border-radius:5px;
            border:1px solid #aaa;
        }
        button {
            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover { background:#0056d6; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Career Recommendation System</h2>

        <form action="/predict" method="POST">

            <label>Skills</label>
            <input type="text" name="skills" placeholder="e.g., Android; Kotlin" required>

            <label>Interest</label>
            <input type="text" name="interest" placeholder="e.g., Web Development" required>

            <label>Personality</label>
            <select name="personality">
                <option>Logical</option>
                <option>Creative</option>
                <option>Analytical</option>
                <option>Social</option>
            </select>

            <label>Education Level</label>
            <select name="education">
                <option>Diploma</option>
                <option>Under Graduate</option>
                <option>Post Graduate</option>
            </select>

            <button type="submit">Predict Career</button>
        </form>
    </div>
</body>
</html>
