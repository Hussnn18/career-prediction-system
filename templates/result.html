<!DOCTYPE html>
<html>
<head>
    <title>Career Prediction Result</title>
    <style>
        body {
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            padding:40px;
        }
        .box {
            background:white;
            width:400px;
            margin:auto;
            margin-top:40px;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }
        h1 {
            color:green;
        }
        a {
            text-decoration:none;
            display:block;
            margin-top:20px;
            padding:10px;
            background:#007bff;
            color:white;
            border-radius:5px;
        }
        a:hover { background:#0056d6; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Recommended Career</h2>
        <h1>{{ career }}</h1>

        <a href="/">Go Back</a>
    </div>
</body>
</html>
